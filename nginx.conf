server {
    listen 80;
    listen [::]:80;
    server_name solvevare.com www.solvevare.com;

    # Redirect HTTP to HTTPS
    return 301 https://www.solvevare.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solvevare.com;

    # Redirect non-www to www
    return 301 https://www.solvevare.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.solvevare.com;

    root /var/www/solvevare;
    index index.html;

    # SSL (update paths to your actual cert files)
    ssl_certificate     /etc/ssl/certs/solvevare.com.crt;
    ssl_certificate_key /etc/ssl/private/solvevare.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Custom Error Pages ────────────────────────────────────
    error_page 404 /404.html;
    error_page 403 /404.html;

    location = /404.html {
        internal;
    }

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/plain text/css application/javascript
               application/json image/svg+xml font/woff font/woff2;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Cache-Control: HTML (1 hour) ──────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Expires $date_gmt always;
        try_files $uri $uri/ =404;
    }

    # ── Cache-Control: CSS & JS (1 year immutable) ────────────
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
        add_header Vary Accept-Encoding;
        try_files $uri =404;
    }

    # ── Cache-Control: Images & Video (1 year immutable) ──────
    location ~* \.(webp|avif|jpg|jpeg|png|gif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
        add_header Vary Accept;
        try_files $uri =404;
    }

    # ── Cache-Control: Fonts (1 year immutable) ───────────────
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── Block sensitive paths ─────────────────────────────────
    location ~* ^/(server|includes|technology-test)/ {
        return 403;
    }

    # ── Main location ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
