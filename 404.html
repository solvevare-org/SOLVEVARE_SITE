<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Solvevare</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/favicon-opt.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"></noscript>
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }
    .error-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .error-glow-1 {
      width: 30rem;
      height: 30rem;
      background: rgba(30, 136, 229, 0.12);
      top: -5rem;
      left: -5rem;
    }
    .error-glow-2 {
      width: 25rem;
      height: 25rem;
      background: rgba(156, 39, 176, 0.1);
      bottom: -5rem;
      right: -5rem;
    }
    .error-glow-3 {
      width: 20rem;
      height: 20rem;
      background: rgba(0, 230, 251, 0.08);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .error-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .error-code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #1E88E5 0%, #00e6fb 50%, #9C27B0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: #9CA3AF;
      font-size: 1.125rem;
      line-height: 1.75;
      margin-bottom: 2rem;
    }
    .error-url {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      color: #00e6fb;
      font-family: monospace;
      margin-bottom: 2rem;
      word-break: break-all;
      max-width: 100%;
    }
    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    @media (min-width: 480px) {
      .error-actions { flex-direction: row; }
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: linear-gradient(325deg, #1e88e5 0%, #47b8ff 55%, #1e88e5 90%);
      background-size: 280% auto;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: background-position 0.5s ease, box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 4px 20px rgba(30, 136, 229, 0.45);
    }
    .btn-home:hover {
      background-position: right top;
      box-shadow: 0 6px 28px rgba(30, 136, 229, 0.6);
      transform: translateY(-2px);
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .redirect-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.875rem 1.5rem;
      background: rgba(0, 230, 251, 0.05);
      border: 1px solid rgba(0, 230, 251, 0.2);
      border-radius: 9999px;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.7);
    }
    .countdown-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      background: rgba(0, 230, 251, 0.15);
      border: 1px solid rgba(0, 230, 251, 0.4);
      border-radius: 50%;
      font-weight: 700;
      color: #00e6fb;
      font-size: 0.875rem;
      flex-shrink: 0;
    }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .quick-link {
      padding: 0.5rem 1.25rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      color: #9CA3AF;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .quick-link:hover {
      background: rgba(0, 230, 251, 0.08);
      border-color: rgba(0, 230, 251, 0.3);
      color: #00e6fb;
    }
    .error-divider {
      width: 4rem;
      height: 2px;
      background: linear-gradient(to right, transparent, #00e6fb, transparent);
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-glow error-glow-1"></div>
    <div class="error-glow error-glow-2"></div>
    <div class="error-glow error-glow-3"></div>

    <div class="error-content">

      <div class="error-code">404</div>

      <h1 class="error-title">Page Not Found</h1>

      <p class="error-desc">
        Oops! The page you're looking for doesn't exist or has been moved.
        Please check the URL or navigate back to our homepage.
      </p>

      <div class="error-url" id="requested-url"></div>

      <div class="error-divider"></div>

      <div class="error-actions">
        <a href="/" class="btn-home">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Go to Homepage
        </a>
        <button class="btn-back" onclick="history.length > 1 ? history.back() : window.location.href='/'">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Go Back
        </button>
      </div>

      <div class="redirect-notice">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Redirecting to homepage in</span>
        <span class="countdown-num" id="countdown">10</span>
        <span>seconds</span>
      </div>

      <div class="quick-links">
        <a href="/" class="quick-link">Home</a>
        <a href="/services.html" class="quick-link">Services</a>
        <a href="/about.html" class="quick-link">About</a>
        <a href="/portfolio.html" class="quick-link">Portfolio</a>
        <a href="/contact.html" class="quick-link">Contact</a>
      </div>

    </div>
  </div>

  <script>
    // Show the invalid URL that was requested
    const urlEl = document.getElementById('requested-url');
    urlEl.textContent = window.location.href;

    // Countdown and auto-redirect
    let seconds = 10;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(function () {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);

    // Cancel redirect if user clicks any link or button
    document.querySelectorAll('a, button').forEach(function (el) {
      el.addEventListener('click', function () {
        clearInterval(timer);
      });
    });
  </script>

</body>
</html>
